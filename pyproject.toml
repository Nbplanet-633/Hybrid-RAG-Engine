[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ask-my-docs"
version = "1.0.0"
description = "Production-grade domain-specific RAG: hybrid retrieval, cross-encoder reranking, enforced citations, and a CI-gated evaluation harness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Neeraj Meena", email = "njmeena633725@gmail.com" }]
keywords = ["rag", "retrieval-augmented-generation", "llm", "chromadb", "bm25", "evaluation"]

dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    # FastAPI needs it to accept file uploads (POST /library/documents); without
    # it the API module fails to import at all.
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
# Document loaders for PDF / HTML sources.
loaders = ["pypdf>=4.2", "beautifulsoup4>=4.12"]
# Persistent vector database (the default `chroma` backend).
chroma = ["chromadb>=0.5"]
# Local embedding + cross-encoder reranking models.
models = ["sentence-transformers>=3.0"]
# Hosted LLM for answer generation.
anthropic = ["anthropic>=0.40"]
# Hosted reranker (alternative to the local cross-encoder).
cohere = ["cohere>=5.5"]
# Third-party evaluation framework (optional, complements the built-in metrics).
ragas = ["ragas>=0.2", "datasets>=2.19"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.11", "types-PyYAML"]

# Everything needed to run the full-fidelity stack locally.
full = [
    "pypdf>=4.2",
    "beautifulsoup4>=4.12",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "anthropic>=0.40",
]

[project.scripts]
askmydocs = "askmydocs.cli:app"

[project.urls]
Homepage = "https://github.com/Nbplanet-633/Hybrid-RAG-Engine"
Repository = "https://github.com/Nbplanet-633/Hybrid-RAG-Engine"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
askmydocs = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that load real ML models or hit the network",
]

[tool.mypy]
python_version = "3.10"
files = ["src", "scripts"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Optional extras: not installed in CI (models, anthropic, cohere), or shipped
# without type information (rank-bm25). Skipping them keeps the result the same
# on every machine instead of depending on which extras happen to be installed.
[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "anthropic.*", "cohere.*", "rank_bm25.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "eval", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.coverage.run]
source = ["src/askmydocs"]
branch = true

[tool.coverage.report]
# Measured at 93% (lines + branches). The floor sits a little below, so a
# refactor can shift a point without breaking the build, but untested new code
# can't slip in unnoticed. Raise it as coverage rises; never lower it to pass.
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
