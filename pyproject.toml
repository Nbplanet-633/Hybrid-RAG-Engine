[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ask-my-docs"
version = "1.0.0"
description = "Production-grade domain-specific RAG: hybrid retrieval, cross-encoder reranking, enforced citations, and a CI-gated evaluation harness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Neeraj Meena", email = "njmeena633725@gmail.com" }]
keywords = ["rag", "retrieval-augmented-generation", "llm", "chromadb", "bm25", "evaluation"]

dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Document loaders for PDF / HTML sources.
loaders = ["pypdf>=4.2", "beautifulsoup4>=4.12"]
# Persistent vector database (the default `chroma` backend).
chroma = ["chromadb>=0.5"]
# Local embedding + cross-encoder reranking models.
models = ["sentence-transformers>=3.0"]
# Hosted LLM for answer generation.
anthropic = ["anthropic>=0.40"]
# Hosted reranker (alternative to the local cross-encoder).
cohere = ["cohere>=5.5"]
# Third-party evaluation framework (optional, complements the built-in metrics).
ragas = ["ragas>=0.2", "datasets>=2.19"]
ui = ["streamlit>=1.35"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.4"]

# Everything needed to run the full-fidelity stack locally.
full = [
    "pypdf>=4.2",
    "beautifulsoup4>=4.12",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "anthropic>=0.40",
    "streamlit>=1.35",
]

[project.scripts]
askmydocs = "askmydocs.cli:app"

[project.urls]
Homepage = "https://github.com/Nbplanet-633/Hybrid-RAG-Engine"
Repository = "https://github.com/Nbplanet-633/Hybrid-RAG-Engine"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
askmydocs = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that load real ML models or hit the network",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "eval", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.coverage.run]
source = ["src/askmydocs"]
branch = true
