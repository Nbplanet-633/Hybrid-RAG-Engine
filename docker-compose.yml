# Local stack. Two profiles mirroring config/app.yaml:
#
#   docker compose up api                      # deterministic, no API key needed
#   docker compose --profile full up api-full   # sentence-transformers + Claude
#
services:
  api:
    build:
      context: .
      target: runtime
    image: ask-my-docs:latest
    environment:
      ASKMYDOCS_PROFILE: offline
      ASKMYDOCS_STORAGE_DIR: /data/storage
      ASKMYDOCS_UPLOADS_DIR: /data/uploads
    ports:
      - "8000:8000"
    volumes:
      # Named volume so the index survives container replacement.
      - index-data:/data
      # Mount the corpus read-only: documents are input, not something the
      # service should be able to modify.
      - ./data/corpus:/app/data/corpus:ro
    restart: unless-stopped

  api-full:
    profiles: ["full"]
    build:
      context: .
      target: runtime
    image: ask-my-docs:latest
    environment:
      ASKMYDOCS_PROFILE: full
      ASKMYDOCS_STORAGE_DIR: /data/storage
      ASKMYDOCS_UPLOADS_DIR: /data/uploads
      # Required by the full profile's Claude generator. Fails fast if unset.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY is required for the full profile}
    ports:
      - "8001:8000"
    volumes:
      - index-data-full:/data
      - ./data/corpus:/app/data/corpus:ro
    restart: unless-stopped

volumes:
  index-data:
  index-data-full:
