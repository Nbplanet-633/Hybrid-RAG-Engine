name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  # The gate runs the deterministic profile: no model downloads, no API key, and
  # byte-identical results run to run. A metric that needs a paid API call cannot
  # gate every pull request.
  ASKMYDOCS_PROFILE: offline

jobs:
  quality:
    name: Lint and type sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[loaders,chroma,dev]"
      - name: Ruff lint
        run: ruff check src eval tests ui
      - name: Ruff format check
        run: ruff format --check src eval tests ui

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[loaders,chroma,dev]"
      - name: Run the test suite
        run: pytest --cov=src/askmydocs --cov-report=xml --cov-report=term
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  golden-set:
    name: Validate the golden dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[loaders,chroma,dev]"
      # Runs before the evaluation: a mislabelled row makes every downstream
      # metric meaningless, and it is far cheaper to catch here.
      - name: Validate labels
        run: python -m eval.validate_golden

  evaluation-gate:
    name: RAG evaluation gate
    runs-on: ubuntu-latest
    needs: [test, golden-set]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[loaders,chroma,dev]"

      - name: Build the index
        run: askmydocs ingest --reset

      - name: Show index state
        run: askmydocs stats

      # Exits non-zero when any metric in eval/thresholds.yaml is breached, which
      # is what makes this a gate rather than a report.
      - name: Run the evaluation and enforce thresholds
        run: python -m eval.run_eval --profile offline

      - name: Publish the report to the job summary
        if: always()
        run: cat eval_reports/report-offline.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the full report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval_reports/

      - name: Comment the report on the pull request
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'eval_reports/report-offline.md';
            if (!fs.existsSync(path)) return;
            const body = fs.readFileSync(path, 'utf8').slice(0, 65000);
            const marker = '<!-- rag-eval-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            const payload = `${marker}\n${body}`;
            // Update in place so a long-running PR does not accumulate one
            // comment per push.
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: payload });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: payload });
            }

  evaluation-gate-models:
    name: RAG evaluation gate (real models)
    runs-on: ubuntu-latest
    needs: [test, golden-set]
    # Downloads ~500 MB of torch and model weights, so it runs on main and on
    # demand rather than blocking every pull request.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[loaders,chroma,models,dev]"
      - name: Cache HuggingFace weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-minilm-msmarco
      - name: Build the index with real embeddings
        run: askmydocs ingest --reset --profile full-retrieval
        env:
          TOKENIZERS_PARALLELISM: "false"
      - name: Evaluate the model-backed retrieval stack
        run: python -m eval.run_eval --profile full-retrieval
        env:
          TOKENIZERS_PARALLELISM: "false"
      - name: Publish the report
        if: always()
        run: cat eval_reports/report-full-retrieval.md >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Build the container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ask-my-docs:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Proves the image can index and answer, not merely that it builds.
      - name: Smoke test the image
        run: |
          docker run --rm ask-my-docs:ci sh -c \
            'askmydocs ingest --reset && askmydocs ask "What is the dispute fee?" | tee /dev/stderr | grep -q "15.00"'
